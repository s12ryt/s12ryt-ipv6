name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag in vX.Y.Z format'
        required: true
        type: string

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
      create-release-tag: ${{ steps.release.outputs.create-tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PUSHED_TAG: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          create_tag=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_VERSION"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version must match vX.Y.Z" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
              tag_commit=$(git rev-list -n 1 "$tag")
              if [[ "$tag_commit" != "$CURRENT_SHA" ]]; then
                echo "tag points to a different commit: $tag" >&2
                exit 1
              fi
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "release already exists: $tag" >&2
                exit 1
              fi
            else
              create_tag=true
            fi
          else
            tag="$PUSHED_TAG"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "tag must match vX.Y.Z" >&2
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release already exists: $tag" >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "create-tag=$create_tag" >>"$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build web application
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm test -- --run
          npm run lint
          npm run build

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go modules
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      - name: Test embedded web assets
        working-directory: web
        run: go test .

      - name: Test Go packages
        env:
          CGO_ENABLED: '1'
        run: |
          go test -race -shuffle=on ./... -count=1 -timeout=600s
          go vet ./...

      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Test release tooling
        shell: bash
        run: |
          bash -n install.sh deploy/install.sh deploy/uninstall.sh deploy/install_test.sh deploy/release_test.sh
          bash deploy/install_test.sh
          bash deploy/release_test.sh

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.1
          args: check

      - name: Upload verified web assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Restore verified web assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create manual release tag
        if: github.event_name == 'workflow_dispatch' && needs.verify.outputs.create-release-tag == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub Release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.verify.outputs.release-tag }}

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag in vX.Y.Z format'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PUSHED_TAG: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          create_tag=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_VERSION"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version must match vX.Y.Z" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
              tag_commit=$(git rev-list -n 1 "$tag")
              if [[ "$tag_commit" != "$CURRENT_SHA" ]]; then
                echo "tag points to a different commit: $tag" >&2
                exit 1
              fi
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "release already exists: $tag" >&2
                exit 1
              fi
            else
              create_tag=true
            fi
          else
            tag="$PUSHED_TAG"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "tag must match vX.Y.Z" >&2
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release already exists: $tag" >&2
              exit 1
            fi
          fi
          echo "RELEASE_TAG=$tag" >>"$GITHUB_ENV"
          echo "CREATE_RELEASE_TAG=$create_tag" >>"$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build web application
        working-directory: web
        run: |
          npm ci
          npm test -- --run
          npm run lint
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test embedded web assets
        working-directory: web
        run: go test .

      - name: Test Go packages
        run: |
          go test ./... -count=1 -timeout=300s
          go vet ./...

      - name: Test release tooling
        shell: bash
        run: |
          bash -n install.sh deploy/install.sh deploy/uninstall.sh deploy/install_test.sh deploy/release_test.sh
          bash deploy/install_test.sh
          bash deploy/release_test.sh

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Create manual release tag
        if: github.event_name == 'workflow_dispatch' && env.CREATE_RELEASE_TAG == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
